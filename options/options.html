<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Saved Captures</title>
    <style>
      body { font: 14px/1.4 -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif; margin: 16px; }
      header { display: flex; gap: 8px; align-items: center; }
      input[type="search"] { flex: 1; padding: 8px; font-size: 14px; }
      .list { margin-top: 16px; }
      .item { border: 1px solid #ddd; border-radius: 6px; padding: 10px; margin-bottom: 12px; }
      .actions { display: flex; gap: 8px; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .muted { color: #666; }
    </style>
  </head>
  <body>
    <header>
      <input id="q" type="search" placeholder="Search by title, publisher, URL..." />
      <button id="exportAll">Export All</button>
      <button id="clearAll">Clear All</button>
    </header>
    <div class="list" id="list"></div>
    <script src="options.js"></script>
  </body>
  </html>
